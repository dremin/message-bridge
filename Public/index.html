<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
	<head>
		<title>Messages</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Messages">
		<link rel="manifest" href="/manifest.json">
		<link rel="apple-touch-icon" href="/icons/icon-192.png">
		<link rel="stylesheet" href="style.css">
		<!-- Polyfill for JSON.parse and JSON.stringify -->
		<script type="text/javascript" src="json3.min.js"></script>
		<script defer type="text/javascript" src="app.js"></script>
		<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
	</head>
	<body>
		<div id="chat-list"><p class="placeholder">Loading...</p></div>
		<div id="no-selected-chat"><p class="placeholder">No chat selected</p></div>
		<div id="selected-chat">
			<div id="chat-messages"></div>
			<form onsubmit="sendMessage(event);return false;">
				<input type="text" id="message-input" name="message" size="40" autocomplete="off">
				<input type="submit" id="message-send" value="Send">
			</form>
		</div>
		<div style="clear:both;"></div>
	</body>
</html>
